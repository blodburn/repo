name: Cross-platform Release

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "windows/**"
      - "CMakeLists.txt"
      - "swift/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: v0.3.0

jobs:
  build-macos:
    name: macOS Swift universal
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build arm64
        working-directory: swift
        run: |
          ARM_DIR="$(swift build -c release --arch arm64 --scratch-path .build-arm64 --show-bin-path)"
          swift build -c release --arch arm64 --scratch-path .build-arm64
          echo "ARM_DIR=$ARM_DIR" >> "$GITHUB_ENV"

      - name: Build x86_64
        working-directory: swift
        run: |
          X86_DIR="$(swift build -c release --arch x86_64 --scratch-path .build-x86_64 --show-bin-path)"
          swift build -c release --arch x86_64 --scratch-path .build-x86_64
          echo "X86_DIR=$X86_DIR" >> "$GITHUB_ENV"

      - name: macOS document export smoke test
        run: |
          set -euo pipefail
          "$ARM_DIR/repo-swift" --export-self-test
          python3 - <<'PY'
          import os, tempfile, zipfile, xml.etree.ElementTree as ET
          root = os.path.join(tempfile.gettempdir(), 'repo-swift-export-smoke')
          for ext in ('docx', 'hwpx'):
              path = os.path.join(root, 'sample.' + ext)
              with zipfile.ZipFile(path) as z:
                  assert z.testzip() is None
                  for name in z.namelist():
                      if name.endswith(('.xml', '.rels', '.hpf')):
                          ET.fromstring(z.read(name))
          pdf = open(os.path.join(root, 'sample.pdf'),'rb').read()
          assert pdf.startswith(b'%PDF-') and b'%%EOF' in pdf[-128:]
          print("macOS DOCX/HWPX XML and PDF smoke tests passed")
          PY

      - name: Package macOS app
        run: |
          set -euo pipefail
          mkdir -p dist/repo.app/Contents/MacOS

          lipo -create             "$ARM_DIR/repo-swift"             "$X86_DIR/repo-swift"             -output "dist/repo.app/Contents/MacOS/repo"

          chmod +x "dist/repo.app/Contents/MacOS/repo"

          cat > "dist/repo.app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>repo</string>
            <key>CFBundleIdentifier</key>
            <string>com.blodburn.repo</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>repo</string>
            <key>CFBundleDisplayName</key>
            <string>repo</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>0.3.0</string>
            <key>CFBundleVersion</key>
            <string>4</string>
            <key>LSMinimumSystemVersion</key>
            <string>13.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST

          codesign --force --deep --sign - "dist/repo.app"
          ditto -c -k --sequesterRsrc --keepParent             "dist/repo.app"             "dist/repo-macOS-universal.zip"
          shasum -a 256 "dist/repo-macOS-universal.zip"             > "dist/repo-macOS-universal.zip.sha256"
          file "dist/repo.app/Contents/MacOS/repo"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: repo-macOS-universal
          path: |
            dist/repo-macOS-universal.zip
            dist/repo-macOS-universal.zip.sha256

  build-windows:
    name: Windows portable single EXE
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install static SQLite
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install sqlite3:x64-windows-static zlib:x64-windows-static

      - name: Configure portable Win32 build
        shell: pwsh
        run: |
          cmake -S windows -B build-win -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build
        shell: pwsh
        run: |
          cmake --build build-win --config Release --parallel

      - name: Editor Undo/Redo styling regression
        shell: pwsh
        run: |
          $exe = (Resolve-Path build-win/Release/repo.exe).Path
          $proc = Start-Process -FilePath $exe -ArgumentList '--style-self-test' -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "Styling Undo/Redo regression: $($proc.ExitCode)" }
          Write-Host "Inline formatting preserves Ctrl+Z and Ctrl+U"

      - name: Export smoke test
        shell: pwsh
        run: |
          $exe = (Resolve-Path build-win/Release/repo.exe).Path
          $proc = Start-Process -FilePath $exe -ArgumentList '--self-test' -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "Export smoke test failed: $($proc.ExitCode)" }
          $root = Join-Path $env:TEMP "repo-export-smoke"
          foreach ($type in @("docx", "hwpx", "pdf")) {
            $file = Join-Path $root "sample.$type"
            if (!(Test-Path $file)) { throw "Missing $file" }
            if ((Get-Item $file).Length -lt 120) { throw "Empty export $file" }
          }
          Add-Type -AssemblyName System.IO.Compression
          foreach ($type in @("docx","hwpx")) {
            $archive = [IO.Compression.ZipFile]::OpenRead((Join-Path $root "sample.$type"))
            try {
              foreach ($entry in $archive.Entries) {
                if ($entry.FullName -match "\.(xml|rels|hpf)$") {
                  $reader = New-Object IO.StreamReader($entry.Open())
                  try { $null = [xml]$reader.ReadToEnd() }
                  finally { $reader.Dispose() }
                }
              }
            } finally { $archive.Dispose() }
          }
          Write-Host "DOCX/HWPX XML and PDF smoke tests passed"

      - name: Package single EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build-win/Release/repo.exe dist/repo-Windows-x64.exe
          (Get-FileHash dist/repo-Windows-x64.exe -Algorithm SHA256).Hash.ToLower() + "  repo-Windows-x64.exe" |
            Set-Content -Encoding ascii dist/repo-Windows-x64.exe.sha256

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: repo-Windows-x64-portable
          path: |
            dist/repo-Windows-x64.exe
            dist/repo-Windows-x64.exe.sha256

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows]

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: repo-*
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: main
          name: repo v0.3.0
          prerelease: true
          body: |
            Cross-platform preview release.

            macOS:
            - native Swift/AppKit build
            - project title, help, object navigation, preview, DOCX/PDF and experimental HWPX export
            - universal binary: Apple Silicon + Intel
            - macOS 13+

            Windows:
            - native C++20 Win32 build
            - project title, help, object navigation and formatted preview
            - inline screenplay paragraph styling in the editor
            - PDF, DOCX, experimental HWPX export
            - single portable EXE, no Qt DLL folder
            - statically linked SQLite and MSVC runtime
            - Windows x64

            Common project format:
            - UTF-8 script/main.txt manuscript
            - project.sqlite metadata/history
            - @@ dialogue @@ / ## description ## / ₩₩ narration ₩₩
            - [[object]] registration and later automatic name recognition
            - Undo: Cmd/Ctrl+Z
            - Redo: Cmd/Ctrl+U

            macOS build is ad-hoc signed, not notarized. On first launch,
            right-click repo.app and choose Open if Gatekeeper blocks it.
          files: |
            dist/repo-macOS-universal.zip
            dist/repo-macOS-universal.zip.sha256
            dist/repo-Windows-x64.exe
            dist/repo-Windows-x64.exe.sha256
