name: Cross-platform Release

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "windows/**"
      - "CMakeLists.txt"
      - "swift/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: v0.1.2

jobs:
  build-macos:
    name: macOS Swift universal
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build arm64
        working-directory: swift
        run: |
          ARM_DIR="$(swift build -c release --arch arm64 --scratch-path .build-arm64 --show-bin-path)"
          swift build -c release --arch arm64 --scratch-path .build-arm64
          echo "ARM_DIR=$ARM_DIR" >> "$GITHUB_ENV"

      - name: Build x86_64
        working-directory: swift
        run: |
          X86_DIR="$(swift build -c release --arch x86_64 --scratch-path .build-x86_64 --show-bin-path)"
          swift build -c release --arch x86_64 --scratch-path .build-x86_64
          echo "X86_DIR=$X86_DIR" >> "$GITHUB_ENV"

      - name: Package macOS app
        run: |
          set -euo pipefail
          mkdir -p dist/repo.app/Contents/MacOS

          lipo -create             "$ARM_DIR/repo-swift"             "$X86_DIR/repo-swift"             -output "dist/repo.app/Contents/MacOS/repo"

          chmod +x "dist/repo.app/Contents/MacOS/repo"

          cat > "dist/repo.app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>repo</string>
            <key>CFBundleIdentifier</key>
            <string>com.blodburn.repo</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>repo</string>
            <key>CFBundleDisplayName</key>
            <string>repo</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>0.1.2</string>
            <key>CFBundleVersion</key>
            <string>3</string>
            <key>LSMinimumSystemVersion</key>
            <string>13.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST

          codesign --force --deep --sign - "dist/repo.app"
          ditto -c -k --sequesterRsrc --keepParent             "dist/repo.app"             "dist/repo-macOS-universal.zip"
          shasum -a 256 "dist/repo-macOS-universal.zip"             > "dist/repo-macOS-universal.zip.sha256"
          file "dist/repo.app/Contents/MacOS/repo"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: repo-macOS-universal
          path: |
            dist/repo-macOS-universal.zip
            dist/repo-macOS-universal.zip.sha256

  build-windows:
    name: Windows portable single EXE
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install static SQLite
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install sqlite3:x64-windows-static

      - name: Configure portable Win32 build
        shell: pwsh
        run: |
          cmake -S windows -B build-win -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build
        shell: pwsh
        run: |
          cmake --build build-win --config Release --parallel

      - name: Package single EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build-win/Release/repo.exe dist/repo-Windows-x64.exe
          (Get-FileHash dist/repo-Windows-x64.exe -Algorithm SHA256).Hash.ToLower() + "  repo-Windows-x64.exe" |
            Set-Content -Encoding ascii dist/repo-Windows-x64.exe.sha256

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: repo-Windows-x64-portable
          path: |
            dist/repo-Windows-x64.exe
            dist/repo-Windows-x64.exe.sha256

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows]

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: repo-*
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: main
          name: repo v0.1.2
          prerelease: true
          body: |
            Cross-platform preview release.

            macOS:
            - native Swift/AppKit build
            - universal binary: Apple Silicon + Intel
            - macOS 13+

            Windows:
            - native C++20 Win32 build
            - single portable EXE, no Qt DLL folder
            - statically linked SQLite and MSVC runtime
            - Windows x64

            Common project format:
            - UTF-8 script/main.txt manuscript
            - project.sqlite metadata/history
            - @@ dialogue @@ / ## description ## / ₩₩ narration ₩₩
            - [[object]] registration and later automatic name recognition
            - Undo: Cmd/Ctrl+Z
            - Redo: Cmd/Ctrl+U

            macOS build is ad-hoc signed, not notarized. On first launch,
            right-click repo.app and choose Open if Gatekeeper blocks it.
          files: |
            dist/repo-macOS-universal.zip
            dist/repo-macOS-universal.zip.sha256
            dist/repo-Windows-x64.exe
            dist/repo-Windows-x64.exe.sha256
