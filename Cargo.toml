[package]
name = "repo"
version = "0.4.0"
edition = "2021"
authors = ["blodburn <38660459+blodburn@users.noreply.github.com>"]
description = "A lightweight, keyboard-first desktop editor for screenplays, novels, and scenario writing"
license = "MIT OR Apache-2.0"
readme = "README.md"

[workspace]
members = [
    ".",
    "core",
]

[dependencies]
repo-core = { path = "core" }
crossterm = { version = "0.28.1", features = ["event-stream"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
unicode-segmentation = "1.12.0"
unicode-width = "0.2.0"

[profile.release]
panic = "abort"
opt-level = 3
lto = true

[[bin]]
name = "repo"
path = "rust/src/main.rs"
